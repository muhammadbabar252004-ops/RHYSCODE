<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Gradiente neon ciano principal -->
    <linearGradient id="g-stroke" x1="25" y1="35" x2="175" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c8f9ff"/>
      <stop offset="40%"  stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00b8ff"/>
    </linearGradient>

    <!-- Fill translúcido interno -->
    <linearGradient id="g-fill" x1="25" y1="35" x2="175" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#72ebff" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#00aaff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0077cc" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Glow externo forte -->
    <filter id="glow-xl" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow médio para fill -->
    <filter id="glow-md" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow suave highlight -->
    <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!--
    MONOGRAMA LD — geometria fiel ao estilo da imagem:
    
    O L forma a estrutura esquerda + base inferior
    O D encaixa no L, formando a "janela" interna direita
    Formato levemente inclinado / italic para dinamismo esports
    
    Pontos-chave do shape (baseado na referência visual):
    - L: barra vertical esquerda + barra horizontal inferior
    - D: barra vertical compartilhada com L + shape fechado direita com "bico" inferior
    - Janela interna: recorte que cria a leitura visual de "LD"
  -->

  <!-- === CAMADA 1: Halo de glow externo === -->
  <g filter="url(#glow-xl)" opacity="0.4">
    <path d="
      M 38 32
      L 38 148
      L 105 148
      L 105 135
      L 52 135
      L 52 32 Z
    " fill="#00aaff"/>
    <path d="
      M 75 32
      L 75 135
      L 110 135
      L 150 115
      L 165 95
      L 150 55
      L 128 32 Z
    " fill="#00aaff"/>
  </g>

  <!-- === CAMADA 2: Fill do monograma === -->
  <g filter="url(#glow-md)">
    <!-- L (parte esquerda + base) -->
    <path d="
      M 38 32
      L 38 150
      L 107 150
      L 107 136
      L 52 136
      L 52 32 Z
    " fill="url(#g-fill)"/>

    <!-- D (parte direita, encaixada) -->
    <path d="
      M 75 32
      L 75 136
      L 112 136
      L 153 116
      L 167 96
      L 152 56
      L 130 32 Z
    " fill="url(#g-fill)"/>

    <!-- Janela interna do D (buraco) — fundo transparente -->
    <path d="
      M 93 50
      L 93 118
      L 113 118
      L 145 104
      L 150 96
      L 138 68
      L 118 50 Z
    " fill="black" fill-opacity="0.85"/>
  </g>

  <!-- === CAMADA 3: Stroke neon luminoso === -->
  <!-- L stroke -->
  <path d="
    M 38 32
    L 38 150
    L 107 150
    L 107 136
    L 52 136
    L 52 32 Z
  "
  fill="none"
  stroke="url(#g-stroke)"
  stroke-width="4"
  stroke-linejoin="miter"
  filter="url(#glow-md)"/>

  <!-- D stroke -->
  <path d="
    M 75 32
    L 75 136
    L 112 136
    L 153 116
    L 167 96
    L 152 56
    L 130 32 Z
  "
  fill="none"
  stroke="url(#g-stroke)"
  stroke-width="4"
  stroke-linejoin="miter"
  filter="url(#glow-md)"/>

  <!-- === CAMADA 4: Highlight branco nas arestas superiores === -->
  <!-- Topo L -->
  <line x1="38" y1="32" x2="52" y2="32"
    stroke="white" stroke-width="3.5" stroke-linecap="round"
    opacity="0.85" filter="url(#glow-sm)"/>
  <!-- Barra vertical esquerda L (topo) -->
  <line x1="38" y1="32" x2="38" y2="60"
    stroke="white" stroke-width="2.5" stroke-linecap="round"
    opacity="0.6" filter="url(#glow-sm)"/>
  <!-- Topo D -->
  <line x1="75" y1="32" x2="130" y2="32"
    stroke="white" stroke-width="3.5" stroke-linecap="round"
    opacity="0.85" filter="url(#glow-sm)"/>

  <!-- === CAMADA 5: Pontos de luz nos vértices === -->
  <circle cx="38"  cy="32"  r="3.5" fill="white"   opacity="0.95" filter="url(#glow-sm)"/>
  <circle cx="52"  cy="32"  r="2.5" fill="#c8f9ff" opacity="0.90" filter="url(#glow-sm)"/>
  <circle cx="75"  cy="32"  r="2.5" fill="#c8f9ff" opacity="0.90" filter="url(#glow-sm)"/>
  <circle cx="130" cy="32"  r="2.5" fill="#c8f9ff" opacity="0.85" filter="url(#glow-sm)"/>
  <circle cx="167" cy="96"  r="4"   fill="#00e8ff" opacity="0.95" filter="url(#glow-sm)"/>
  <circle cx="38"  cy="150" r="3"   fill="#00d4ff" opacity="0.85" filter="url(#glow-sm)"/>
  <circle cx="107" cy="150" r="3"   fill="#00d4ff" opacity="0.85" filter="url(#glow-sm)"/>

  <!-- === Linha decorativa sutil inferior === -->
  <line x1="30" y1="165" x2="170" y2="165"
    stroke="url(#g-stroke)" stroke-width="2" stroke-linecap="round"
    opacity="0.35" filter="url(#glow-sm)"/>
</svg>
